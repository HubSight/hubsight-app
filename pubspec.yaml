name: hubsight_app
description: HubSight - Smart Surveillance & Playback Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HubSight SDK
  hubsight_sdk: ^1.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Media
  dio: ^5.7.0
  flutter_webrtc: ^0.12.5
  socket_io_client: ^3.0.2

  # Firebase (Push Notifications)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^22.3.1

  # Local Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # UI & Utilities
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  file_picker: ^8.1.4
  go_router: ^13.2.0
  mobile_scanner: ^7.4.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
