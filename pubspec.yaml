name: cctv_app
description: HubSight - Smart Surveillance & Playback Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3-beta
  flutter_webrtc: ^0.10.4
  
  # Firebase (Push Notifications)
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  
  # Local Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0
  
  # UI & Utilities
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  go_router: ^13.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

